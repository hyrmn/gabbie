<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — To-Do Tracker</title>
    <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="h-full bg-gray-50 text-gray-900 flex items-center justify-center">
    <div class="w-full max-w-md px-4">
        <div class="bg-white rounded-lg shadow-md border border-gray-200 p-8">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-900">To-Do Tracker</h1>
                <p class="text-gray-500 mt-1">Sign in to your account</p>
            </div>

            <div id="login-root"
                 x-data="loginForm('{{.SupabaseURL}}', '{{.SupabaseAnonKey}}')"
                 @submit.prevent="login">

                <!-- Status messages -->
                <div x-show="error" x-text="error"
                     class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>
                <div x-show="success" x-text="success"
                     class="mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm"></div>
                <div x-show="loading"
                     class="mb-4 p-3 bg-blue-50 border border-blue-200 text-blue-700 rounded-lg text-sm">
                    Signing in...
                </div>

                <!-- Email/password form -->
                <form class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            Email
                        </label>
                        <input type="email" id="email" name="email" x-model="email" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                               placeholder="you@example.com">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                            Password
                        </label>
                        <input type="password" id="password" name="password" x-model="password" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                               placeholder="••••••••">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="remember" x-model="rememberMe"
                               class="rounded border-gray-300 text-green-600 focus:ring-green-500">
                        <label for="remember" class="text-sm text-gray-600">Remember me for 7 days</label>
                    </div>
                    <button type="submit" :disabled="loading"
                            class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">or</span>
                    </div>
                </div>

                <!-- Magic link -->
                <button @click="magicLink" :disabled="loading || !email"
                        class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Send Magic Link
                </button>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    function loginForm(supabaseUrl, supabaseAnonKey) {
        return {
            email: '',
            password: '',
            rememberMe: false,
            error: '',
            success: '',
            loading: false,
            supabase: null,

            init() {
                this.supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);
            },

            async login() {
                this.error = '';
                this.success = '';
                this.loading = true;

                const { data, error } = await this.supabase.auth.signInWithPassword({
                    email: this.email,
                    password: this.password,
                });

                if (error) {
                    this.error = error.message;
                    this.loading = false;
                    return;
                }

                // Send token to our backend
                const res = await fetch('/auth/callback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ access_token: data.session.access_token, remember_me: this.rememberMe }),
                });

                if (!res.ok) {
                    this.error = 'Authentication failed on server';
                    this.loading = false;
                    return;
                }

                window.location.href = '/dashboard';
            },

            async magicLink() {
                this.error = '';
                this.success = '';
                this.loading = true;

                const { error } = await this.supabase.auth.signInWithOtp({
                    email: this.email,
                    options: { emailRedirectTo: window.location.origin + '/auth/callback' },
                });

                if (error) {
                    this.error = error.message;
                    this.loading = false;
                    return;
                }

                this.success = 'Check your email for a magic link!';
                this.loading = false;
            },
        };
    }
    </script>
</body>
</html>
