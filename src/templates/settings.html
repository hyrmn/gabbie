{{template "base.html" .}}

{{define "title"}}Settings — To-Do Tracker{{end}}

{{define "sidebar"}}
<div class="mt-4">
    <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Settings</p>
    <a href="/settings" class="block px-3 py-1.5 rounded text-sm bg-gray-800 text-white">General</a>
    <a href="/settings/api-keys" class="block px-3 py-1.5 rounded text-sm text-gray-300 hover:bg-gray-800 hover:text-white">API Keys</a>
</div>
{{end}}

{{define "content"}}
<div class="max-w-3xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Settings</h2>

    <!-- Profile section -->
    <div class="mb-8 bg-white rounded-lg shadow border border-gray-200 p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Profile</h3>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <p class="text-gray-900">{{.User.Email}}</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">User ID</label>
                <p class="text-gray-500 text-sm font-mono">{{.User.ID}}</p>
            </div>
        </div>
    </div>

    <!-- Quick links -->
    <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Quick Links</h3>
        <div class="space-y-3">
            <a href="/settings/api-keys" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 border border-gray-100 transition">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                </svg>
                <div>
                    <p class="text-sm font-medium text-gray-900">API Keys</p>
                    <p class="text-xs text-gray-500">Manage API keys for programmatic access</p>
                </div>
            </a>
        </div>
    </div>
</div>
{{end}}
