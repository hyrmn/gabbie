{{template "base.html" .}}

{{define "title"}}{{.Title}} — To-Do Tracker{{end}}

{{define "content"}}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center max-w-md">
        <!-- Error icon -->
        <div class="mx-auto w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-6">
            <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
        </div>

        <!-- Status code -->
        <p class="text-6xl font-bold text-gray-300 mb-4">{{.StatusCode}}</p>

        <!-- Error message -->
        <h2 class="text-2xl font-bold text-gray-900 mb-2">{{.Title}}</h2>
        {{if .Message}}
        <p class="text-gray-600 mb-6">{{.Message}}</p>
        {{end}}

        <!-- Action buttons -->
        <div class="flex items-center justify-center gap-3">
            <a href="/dashboard" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition">
                ← Back to Dashboard
            </a>
            <a href="javascript:history.back()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition">
                Go Back
            </a>
        </div>
    </div>
</div>
{{end}}
