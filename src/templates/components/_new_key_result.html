{{define "components/_new_key_result.html"}}
<div id="new-key-result" class="mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
    <div class="flex items-start gap-3">
        <svg class="w-5 h-5 text-yellow-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
        <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-yellow-800">Save this key — you won't see it again!</p>
            <div class="mt-2 flex items-center gap-2">
                <code id="raw-key-{{.APIKey.ID}}" class="flex-1 bg-white px-3 py-2 rounded border border-yellow-300 text-xs font-mono text-gray-900 break-all">{{.RawKey}}</code>
                <button type="button"
                        onclick="navigator.clipboard.writeText(document.getElementById('raw-key-{{.APIKey.ID}}').textContent); this.textContent = 'Copied!'; setTimeout(() => this.textContent = 'Copy', 2000)"
                        class="px-3 py-2 text-sm bg-yellow-200 hover:bg-yellow-300 text-yellow-800 rounded border border-yellow-300 transition whitespace-nowrap">
                    Copy
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}
