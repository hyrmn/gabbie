<!-- _new_item_form.html: Quick-add form for new items at the top of the list -->
<form id="new-item-form" hx-post="/lists/{{.List.ID}}/items"
      hx-target="#items-container" hx-swap="innerHTML"
      class="flex gap-3 items-end mb-4">
    <div class="flex-1">
        <label for="new-item-title" class="block text-sm font-medium text-gray-700 mb-1">
            Add Item
        </label>
        <input type="text" id="new-item-title" name="title" required
               placeholder="What needs to be done?"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm">
    </div>
    <button type="submit"
            class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg transition whitespace-nowrap">
        Add
    </button>
</form>
<div id="create-item-error" class="text-red-600 text-sm mb-2"></div>
