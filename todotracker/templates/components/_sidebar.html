{{define "_sidebar.html"}}
<!-- My Lists section -->
<div class="mt-4">
    <div class="flex items-center justify-between px-3 mb-2">
        <h3 class="text-xs font-semibold uppercase text-gray-400 tracking-wider">My Lists</h3>
        <!-- New List button -->
        <button
            x-data
            @click="$dispatch('open-new-list-modal')"
            class="text-gray-400 hover:text-green-400 transition p-0.5 rounded"
            title="Create new list">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
        </button>
    </div>

    <!-- Lists loaded from API -->
    <template x-if="loading">
        <div class="px-3 py-2">
            <div class="flex items-center gap-2 text-gray-400 text-sm">
                <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                Loading...
            </div>
        </div>
    </template>

    <template x-if="!loading && lists.length === 0">
        <div class="px-3 py-2">
            <p class="text-sm text-gray-400 italic">No lists yet</p>
            <button
                x-data
                @click="$dispatch('open-new-list-modal')"
                class="mt-1 text-xs text-green-400 hover:text-green-300 transition flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Create your first list
            </button>
        </div>
    </template>

    <template x-for="list in lists" :key="list.id">
        <a :href="'/lists/' + list.id"
           class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-gray-800 transition text-sm text-gray-300 hover:text-white"
           :title="list.name">
            <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            <span class="truncate" x-text="list.name"></span>
        </a>
    </template>
</div>

<!-- New List Modal (HTMX-powered) -->
<div
    x-data="{ open: false }"
    @open-new-list-modal.window="open = true"
    x-show="open"
    class="fixed inset-0 z-50 flex items-center justify-center"
    x-cloak>

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black bg-opacity-50" @click="open = false"></div>

    <!-- Modal panel -->
    <div
        x-show="open"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
        class="relative bg-white rounded-lg shadow-xl w-full max-w-md mx-4 p-6 z-10">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-gray-900">Create New List</h3>
            <button @click="open = false" class="text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <form
            hx-post="/api/lists"
            hx-swap="none"
            hx-on::after-request="open = false; $dispatch('lists:refresh');"
            class="space-y-4">
            <div>
                <label for="new-list-name" class="block text-sm font-medium text-gray-700 mb-1">
                    List Name
                </label>
                <input type="text"
                       id="new-list-name"
                       name="name"
                       required
                       placeholder="e.g. Project Tasks, Sprint Goals"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm">
            </div>
            <div>
                <label for="new-list-desc" class="block text-sm font-medium text-gray-700 mb-1">
                    Description (optional)
                </label>
                <textarea id="new-list-desc"
                          name="description"
                          rows="2"
                          placeholder="What's this list for?"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm"></textarea>
            </div>
            <div class="flex gap-2 justify-end">
                <button type="button" @click="open = false"
                        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                    Cancel
                </button>
                <button type="submit"
                        class="px-4 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg transition">
                    Create List
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
