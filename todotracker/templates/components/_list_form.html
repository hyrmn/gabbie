{{define "components/_list_form.html"}}
<form hx-post="/lists" hx-swap="none" class="space-y-4">
    <div>
        <label for="list-name" class="block text-sm font-medium text-gray-700 mb-1">
            List Name <span class="text-red-500">*</span>
        </label>
        <input type="text" id="list-name" name="name" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
               placeholder="e.g. Sprint 24">
    </div>
    <div>
        <label for="list-description" class="block text-sm font-medium text-gray-700 mb-1">
            Description
        </label>
        <textarea id="list-description" name="description" rows="2"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                  placeholder="Optional description"></textarea>
    </div>
    <div id="create-list-error" class="text-red-600 text-sm"></div>
    <button type="submit"
            class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition">
        Create List
    </button>
</form>
{{end}}
