{{define "base.html"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}To-Do Tracker{{end}}</title>
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.1" defer></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/css/output.css">
    {{block "head" .}}{{end}}
</head>
<body class="h-full bg-gray-50 text-gray-900" hx-boost="true">
    <div class="flex h-full" x-data="{ sidebarOpen: false, user: null }"
         x-init="fetch('/auth/session').then(r => r.ok ? r.json() : null).then(d => { if (d) user = d })">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex-shrink-0 hidden md:flex flex-col">
            <div class="p-4 border-b border-gray-700">
                <h1 class="text-lg font-bold text-green-400">To-Do Tracker</h1>
            </div>
            <nav class="flex-1 p-4">
                <a href="/dashboard" class="block px-3 py-2 rounded hover:bg-gray-800 text-green-300">
                    Dashboard
                </a>
                {{block "sidebar" .}}{{end}}
            </nav>
            <div class="p-4 border-t border-gray-700">
                <!-- Auth state -->
                <template x-if="user && user.authenticated">
                    <div>
                        <p class="text-sm text-gray-300 truncate" x-text="user.user_email"></p>
                        <button hx-post="/auth/logout" hx-swap="none"
                                class="mt-2 text-xs text-gray-400 hover:text-red-400 transition">
                            Sign Out
                        </button>
                    </div>
                </template>
                <template x-if="!user || !user.authenticated">
                    <a href="/login" class="block text-sm text-green-400 hover:text-green-300 transition">
                        Sign In
                    </a>
                </template>
            </div>
        </aside>

        <!-- Mobile sidebar overlay -->
        <div x-show="sidebarOpen" class="fixed inset-0 z-40 md:hidden" @click="sidebarOpen = false">
            <div class="absolute inset-0 bg-gray-600 opacity-75"></div>
        </div>

        <!-- Mobile sidebar -->
        <div x-show="sidebarOpen" class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 text-white md:hidden"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="-translate-x-full"
             x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="translate-x-0"
             x-transition:leave-end="-translate-x-full">
            <div class="p-4 border-b border-gray-700">
                <h1 class="text-lg font-bold text-green-400">To-Do Tracker</h1>
            </div>
            <nav class="flex-1 p-4">
                <a href="/dashboard" class="block px-3 py-2 rounded hover:bg-gray-800 text-green-300">Dashboard</a>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <template x-if="user && user.authenticated">
                    <div>
                        <p class="text-sm text-gray-300 truncate" x-text="user.user_email"></p>
                        <button hx-post="/auth/logout" hx-swap="none"
                                class="mt-2 text-xs text-gray-400 hover:text-red-400 transition">Sign Out</button>
                    </div>
                </template>
                <template x-if="!user || !user.authenticated">
                    <a href="/login" class="block text-sm text-green-400 hover:text-green-300 transition">Sign In</a>
                </template>
            </div>
        </div>

        <!-- Main content -->
        <main class="flex-1 flex flex-col min-h-0 overflow-auto">
            <!-- Top nav -->
            <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-4">
                <button @click="sidebarOpen = !sidebarOpen" class="md:hidden text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <h2 class="text-lg font-semibold">{{.Title}}</h2>
                <div class="ml-auto">
                    <template x-if="user && user.authenticated">
                        <button hx-post="/auth/logout" hx-swap="none"
                                class="text-sm text-gray-500 hover:text-red-600 transition">
                            Sign Out
                        </button>
                    </template>
                    <template x-if="!user || !user.authenticated">
                        <a href="/login" class="text-sm text-green-600 hover:text-green-700 transition">Sign In</a>
                    </template>
                </div>
            </header>

            <!-- Page content -->
            <div class="flex-1 p-4 overflow-auto">
                {{block "content" .}}
                <p>No content.</p>
                {{end}}
            </div>
        </main>
    </div>

    {{block "scripts" .}}{{end}}
    <script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
