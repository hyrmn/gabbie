{{template "base.html" .}}

{{define "title"}}Page Not Found — To-Do Tracker{{end}}

{{define "content"}}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center max-w-md">
        <!-- 404 icon -->
        <div class="mx-auto w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-6">
            <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <!-- Status code -->
        <p class="text-6xl font-bold text-gray-300 mb-4">404</p>

        <!-- Error message -->
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Page Not Found</h2>
        <p class="text-gray-600 mb-6">The page you're looking for doesn't exist or has been moved.</p>

        <!-- Action buttons -->
        <div class="flex items-center justify-center gap-3">
            <a href="/dashboard" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition">
                ← Back to Dashboard
            </a>
            <a href="javascript:history.back()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition">
                Go Back
            </a>
        </div>
    </div>
</div>
{{end}}
